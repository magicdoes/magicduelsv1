# MagicDuels configuration

request-timeout-seconds: 60
countdown-seconds: 3

# Wagers require Vault + a Vault-compatible economy plugin.
# Players can use amounts such as: 1000, 1k, 25k, 1.5m, 2m, 1b
wagers:
  enabled: true
  minimum: 0
  maximum: 1000000000

# When a player runs /duel accept, this menu appears first.
# The challenged player selects the gamemode for the duel.
gamemode-gui:
  title: '&8Choose Duel Gamemode'
  size: 27
  filler: GRAY_STAINED_GLASS_PANE

# Gamemode kits are temporary. The players' real inventories are saved before
# the duel and completely restored afterwards.
#
# Inventory format: SLOT:MATERIAL:AMOUNT
# Hotbar slots are 0-8. Main inventory slots are 9-35.
# Armor/offhand format: MATERIAL or MATERIAL:AMOUNT
#
# You can freely edit these kits or add more modes using the same format.
gamemodes:
  sword:
    enabled: true
    slot: 10
    icon: DIAMOND_SWORD
    name: '&b&lSword PvP'
    lore:
      - '&7Diamond sword and armor'
      - '&7Simple classic PvP'
    kit:
      helmet: DIAMOND_HELMET
      chestplate: DIAMOND_CHESTPLATE
      leggings: DIAMOND_LEGGINGS
      boots: DIAMOND_BOOTS
      offhand: SHIELD
      inventory:
        - '0:DIAMOND_SWORD:1'
        - '1:GOLDEN_APPLE:8'
        - '8:COOKED_BEEF:32'

  axe:
    enabled: true
    slot: 12
    icon: DIAMOND_AXE
    name: '&c&lAxe PvP'
    lore:
      - '&7Diamond axe and shield'
      - '&7Heavy-hitting combat'
    kit:
      helmet: DIAMOND_HELMET
      chestplate: DIAMOND_CHESTPLATE
      leggings: DIAMOND_LEGGINGS
      boots: DIAMOND_BOOTS
      offhand: SHIELD
      inventory:
        - '0:DIAMOND_AXE:1'
        - '1:DIAMOND_SWORD:1'
        - '2:GOLDEN_APPLE:8'
        - '8:COOKED_BEEF:32'

  archer:
    enabled: true
    slot: 14
    icon: BOW
    name: '&a&lArcher'
    lore:
      - '&7Bow, arrows and sword'
      - '&7Fight from range or up close'
    kit:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
      offhand: SHIELD
      inventory:
        - '0:IRON_SWORD:1'
        - '1:BOW:1'
        - '2:ARROW:64'
        - '3:GOLDEN_APPLE:4'
        - '8:COOKED_BEEF:32'

  crystal:
    enabled: true
    slot: 22
    icon: END_CRYSTAL
    name: '&d&lCrystal PvP'
    lore:
      - '&7End crystals, obsidian and Netherite gear'
      - '&7Fast explosive PvP'
    kit:
      helmet: NETHERITE_HELMET
      chestplate: NETHERITE_CHESTPLATE
      leggings: NETHERITE_LEGGINGS
      boots: NETHERITE_BOOTS
      offhand: TOTEM_OF_UNDYING
      inventory:
        - '0:NETHERITE_SWORD:1'
        - '1:END_CRYSTAL:64'
        - '2:OBSIDIAN:64'
        - '3:GOLDEN_APPLE:16'
        - '4:TOTEM_OF_UNDYING:1'
        - '8:COOKED_BEEF:32'

  netherite:
    enabled: true
    slot: 16
    icon: NETHERITE_SWORD
    name: '&5&lNetherite'
    lore:
      - '&7Full Netherite equipment'
      - '&7For longer, stronger fights'
    kit:
      helmet: NETHERITE_HELMET
      chestplate: NETHERITE_CHESTPLATE
      leggings: NETHERITE_LEGGINGS
      boots: NETHERITE_BOOTS
      offhand: SHIELD
      inventory:
        - '0:NETHERITE_SWORD:1'
        - '1:NETHERITE_AXE:1'
        - '2:GOLDEN_APPLE:16'
        - '8:COOKED_BEEF:32'

# Commands players may still use while actively dueling.
# Everything else is blocked.
allowed-commands-during-duel:
  - duel

